services:
  - type: web
    name: policyholder-service
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: policyholder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: policyholder-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Mismo valor en TODOS los microservicios (autentica la entrega de eventos).
      - key: INTERNAL_TOKEN
        sync: false
      - key: DEBUG
        value: "0"
      - key: RUN_WORKER_IN_WEB
        value: "1"
      # Los servicios gratis tardan ~1 minuto en despertar.
      - key: SYNC_TIMEOUT
        value: "60"

  - type: keyvalue
    name: policyholder-redis
    plan: free
    ipAllowList: []

databases:
  - name: policyholder-db
    databaseName: policyholder_db
    user: policyholder_user
    plan: free
